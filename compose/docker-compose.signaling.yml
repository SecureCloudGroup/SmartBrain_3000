# Operator-run PUBLIC node: Caddy (auto-TLS) + WebRTC signaling broker + coturn (STUN/TURN).
#
# This is the ONLY public, operator-run piece of the remote-access path, and it is
# content-blind: the broker sees only SDP (setup metadata), and coturn relays only DTLS
# ciphertext. Caddy terminates TLS and reverse-proxies wss:// to the broker, auto-obtaining
# and renewing a Let's Encrypt cert for SIGNALING_DOMAIN.
#
# Deploy on a small VPS (NOT the home machine). First: point SIGNALING_DOMAIN's DNS A record
# at this VPS (DNS-only, no CDN proxy) and open inbound 80/443 (TCP) + 3478 (TCP+UDP) +
# 49160-49260 (UDP). Then put the secrets in a .env file beside this compose file and run:
#   docker compose -f compose/docker-compose.signaling.yml up -d
#
# Required env (.env): SIGNALING_DOMAIN, ACME_EMAIL, TURN_SECRET, TURN_PUBLIC_IP (the VPS public IPv4).
# Registration auth — set exactly one:
#   SIGNALING_OPEN=1            hosted/public: tokenless registration (the public app ships NO secret),
#                              bounded by a desktop cap + registration rate-limit.
#   SIGNALING_TOKEN=<secret>   self-host: a shared registration secret. This is the default
#                              posture — SIGNALING_OPEN is 0 unless you set it.
#
# TURN uses EPHEMERAL credentials (coturn use-auth-secret): the broker mints short-lived creds from
# TURN_SECRET per connection and pushes them over signaling, so no TURN secret is ever baked into a
# client or QR — a leaked credential expires instead of becoming an open relay. Relay grants ONLY
# bandwidth, never app access (gated by the device credential + channel-auth). TURN_SECRET stays on
# the node; clients never see it.
services:
  caddy:
    image: caddy:2
    container_name: sb_caddy
    restart: unless-stopped
    ports:
      - "80:80"     # ACME HTTP-01 challenge + HTTP->HTTPS redirect
      - "443:443"   # wss:// signaling (TLS terminated here)
    environment:
      - SIGNALING_DOMAIN=${SIGNALING_DOMAIN:?set the signaling subdomain, e.g. connect.example.com}
      - ACME_EMAIL=${ACME_EMAIL:?set an email for Let's Encrypt notices}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./web:/srv/web:ro       # data-free PWA shell served at / (built from app/smartbrain_3000/web)
      - caddy_data:/data        # persists issued certs across restarts (don't lose this)
      - caddy_config:/config
    depends_on:
      - signaling
    logging:                # bound the container log on disk (default json-file is unbounded)
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  signaling:
    build: ../signaling
    container_name: sb_signaling
    environment:
      - SIGNALING_HOST=0.0.0.0
      - SIGNALING_PORT=8089
      # Registration auth. Defaults CLOSED: someone deploying this file is self-hosting,
      # and an unset variable must not silently hand them a broker the whole internet can
      # register desktops on. The hosted node opts into open mode via its own .env.
      # With neither this nor SIGNALING_TOKEN set the broker refuses to start.
      - SIGNALING_OPEN=${SIGNALING_OPEN:-0}
      - SIGNALING_TOKEN=${SIGNALING_TOKEN:-}
      # Ephemeral TURN: the broker mints short-lived coturn creds from this secret and pushes them
      # to desktops + phones over signaling — no static creds in any client or QR. SAME value as
      # coturn's --static-auth-secret below.
      - SIGNALING_TURN_SECRET=${TURN_SECRET:?set a TURN auth secret (shared with coturn)}
      # STUN/TURN urls the node hands clients. ?transport=tcp is the fallback when a network (some
      # cellular carriers) blocks UDP — coturn also listens on TCP 3478.
      - SIGNALING_ICE_URLS=stun:${SIGNALING_DOMAIN}:3478,turn:${SIGNALING_DOMAIN}:3478,turn:${SIGNALING_DOMAIN}:3478?transport=tcp
      # Ephemeral TURN credential lifetime. 1h: a leaked credential is useful for minutes,
      # not a day, and both clients get fresh creds on every (re)register anyway.
      - SIGNALING_TURN_TTL=3600
      # Desktop proof-of-possession: desktop_id -> Ed25519 pubkey bindings (trust-on-first-use)
      # persist here so a restart cannot be used to re-bind someone's id. Named volume, owned
      # by the broker's unprivileged user (see signaling/Dockerfile).
      - SIGNALING_STATE_FILE=/state/bindings.json
      # Transition window ONLY: 1 admits unsigned (pre-proof) Desktops for ids that have no
      # binding yet. Leave 0 once every install has updated — an unsigned hello can never take
      # over a bound id either way.
      - SIGNALING_ALLOW_LEGACY=${SIGNALING_ALLOW_LEGACY:-0}
      # Per-IP limits key on X-Forwarded-For ONLY when the socket peer is one of these
      # networks. Caddy reaches the broker over the compose bridge (172.16.0.0/12 covers
      # docker's default pools); anything else is keyed on the raw peer, so a direct client
      # cannot forge the header to dodge the limits.
      - SIGNALING_TRUSTED_PROXIES=172.16.0.0/12
    volumes:
      - sb_signaling_state:/state
    # No published port — Caddy reaches it on the internal network as signaling:8089.
    # APP-LEVEL health: the probe completes a real hello/reply exchange, because the
    # observed failure mode accepts sockets while the handler layer is starved — a
    # TCP check would call that healthy. Docker only MARKS unhealthy; the restart is done
    # by the user-level timer in deploy/sb-autoheal.service + deploy/sb-autoheal.timer
    # (every 2 min: restart every container Docker marks unhealthy) — install both.
    healthcheck:
      test: ["CMD", "python", "/srv/health.py"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:                # bound the container log on disk (default json-file is unbounded)
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  coturn:
    image: coturn/coturn:4.6
    container_name: sb_coturn
    # coturn needs a wide UDP relay-port range reachable from clients; host networking
    # is the simplest correct setup on a dedicated VPS.
    network_mode: host
    # --no-tls/--no-dtls: no cert here (plain TURN on 3478; add TURNS later if needed).
    # --log-file=stdout: log to the container console so `docker compose logs coturn` works
    # (coturn otherwise logs to a file inside the container, which hides startup + errors).
    # --listening-ip/--relay-ip pin STUN/TURN + relay allocations to the VPS public IP. With
    # host networking coturn otherwise auto-discovers the docker0/bridge IPs (172.x) and ::1
    # and can hand a client an unreachable relay address; pinning to the public IP avoids that.
    # Loopback is denied via the 127/8 range below (coturn has no --no-loopback-peers flag).
    # IPv6 denies are omitted because this VPS has no IPv6 assigned; re-add RFC1918-equivalent
    # IPv6 ranges (fc00::/7 ULA, fe80::/10 link-local, ::1) if you enable IPv6 on the host.
    # List form (not a folded ">" block): each arg is exactly one argv element — robust against
    # whitespace-splitting surprises. NOTE: coturn 4.6 logs one benign "ERROR: CONFIG: Unknown
    # argument:" (empty value) at startup regardless of the arguments given (reproducible with a
    # minimal command) — it's an image quirk with no functional impact (coturn starts + relays
    # normally). Don't chase it.
    command:
      - "-n"
      - "--no-cli"
      - "--no-tls"
      - "--no-dtls"
      - "--log-file=stdout"
      - "--listening-port=3478"
      - "--listening-ip=${TURN_PUBLIC_IP:?set the VPS public IPv4, e.g. 203.0.113.10}"
      - "--relay-ip=${TURN_PUBLIC_IP}"
      - "--min-port=49160"
      - "--max-port=49260"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SECRET:?set a TURN auth secret (shared with the broker)}"
      - "--realm=smartbrain"
      - "--fingerprint"
      - "--no-multicast-peers"
      - "--no-tcp-relay"
      - "--stale-nonce=600"
      - "--user-quota=12"
      - "--total-quota=1200"
      - "--max-bps=2000000"
      - "--denied-peer-ip=0.0.0.0-0.255.255.255"
      - "--denied-peer-ip=10.0.0.0-10.255.255.255"
      - "--denied-peer-ip=100.64.0.0-100.127.255.255"
      - "--denied-peer-ip=127.0.0.0-127.255.255.255"
      - "--denied-peer-ip=169.254.0.0-169.254.255.255"
      - "--denied-peer-ip=172.16.0.0-172.31.255.255"
      - "--denied-peer-ip=192.168.0.0-192.168.255.255"
    restart: unless-stopped
    logging:                # bound the container log on disk (default json-file is unbounded)
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
  sb_signaling_state:   # desktop_id -> pubkey bindings (SIGNALING_STATE_FILE); keep it
