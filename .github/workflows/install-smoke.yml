# Install smoke test — the documented Linux install, exactly as a stranger runs it, on a fresh
# runner: download ONE file, `docker compose up`, expect healthy. This is the test that would have
# caught the named-volumes crash (root-owned bind mounts) and the bifrost:latest drift BEFORE a user
# did. Docker Desktop's permissive file sharing hides Linux-only failures on every dev Mac, so this
# is the one honest, automatable check of the real cold start.
#
# Runs after each release publishes its image (workflow_run), on demand, and weekly (catches drift
# in things we don't pin — base images, registries — even when we haven't shipped).
name: Install smoke (Linux)

on:
  workflow_run:
    workflows: ["Release image"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC — weekly drift canary

permissions:
  contents: read

jobs:
  smoke:
    # For workflow_run, only bother when the release actually succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Install exactly like the docs say
        run: |
          set -eux
          mkdir smoke && cd smoke
          curl -fsSLO https://raw.githubusercontent.com/SecureCloudGroup/SmartBrain_3000/main/compose/docker-compose.release.yml
          docker compose -f docker-compose.release.yml up -d
      - name: Wait for health (the promise is "a minute or two")
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:33000/api/health >/dev/null; then
              echo "HEALTHY after ~$((i*5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::App not healthy after 300s — a fresh Linux install is broken"
          cd smoke
          docker compose -f docker-compose.release.yml ps
          docker compose -f docker-compose.release.yml logs --tail 40
          exit 1
      - name: First-run setup actually works (not just a 200 on /health)
        run: |
          set -eux
          curl -sf -c /tmp/cj -X POST http://localhost:33000/api/account/setup \
            -H 'content-type: application/json' -d '{"passphrase":"smoke-test-passphrase"}' \
            | grep -q recovery_key
          curl -sf -b /tmp/cj -X POST http://localhost:33000/api/kb \
            -H 'content-type: application/json' -d '{"title":"Smoke","content":"the CANARY sentence"}' >/dev/null
          curl -sf -b /tmp/cj "http://localhost:33000/api/kb/search?q=canary&mode=lexical" \
            | grep -q '"Smoke"'
          echo "setup + ingest + search all work on a fresh install"
      - name: Bifrost must not log requests (privacy regression gate)
        # Bifrost's default request logging wrote every prompt/response to a plaintext
        # logs.db. The compose entrypoint + the app's admin-API enforcement disable it;
        # this step makes any regression loud. The chat attempt is EXPECTED to fail (no
        # provider on a fresh install) — the point is that even a failed inference
        # request must leave no logs.db behind, and the client flags must be off.
        working-directory: smoke
        run: |
          set -eux
          curl -s -o /dev/null -X POST http://localhost:38080/v1/chat/completions \
            -H 'content-type: application/json' \
            -d '{"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":"smoke canary"}]}' || true
          sleep 2
          docker compose -f docker-compose.release.yml exec -T bifrost \
            sh -c 'test ! -e /app/data/logs.db' \
            || { echo "::error::plaintext logs.db exists — Bifrost request logging is back"; exit 1; }
          docker compose -f docker-compose.release.yml exec -T bifrost \
            sh -c 'grep -q "\"logs_store\":{\"enabled\":false}" /app/data/config.json' \
            || { echo "::error::bifrost config.json is missing the logs_store kill"; exit 1; }
          curl -sf http://localhost:38080/api/config | grep -q '"is_logs_connected":false' \
            || { echo "::error::bifrost reports a connected logs store"; exit 1; }
          echo "no request logging: logs.db absent, store disabled, config enforced"

  # The documented NATIVE Linux install, exactly as a stranger runs it: download the
  # script, run it with --headless, expect a systemd --user unit serving on loopback.
  # Same honesty contract as the Docker job above — this is the two-command story the
  # docs promise, run verbatim against the latest published release.
  script-install:
    name: script install (native, headless)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The Linux tarball first ships with v0.9.0. Until a release carries it, this
      # job reports a clear skip instead of a misleading red.
      #
      # The install needs THREE files that arrive from TWO workflows: the launcher build
      # uploads the tarball and .sha256, and the sign job attaches .sha256.minisig LAST —
      # while this smoke fires when "Release image" completes, which never waits for the
      # sign job. v0.9.13 lost exactly that race (the script 404'd seven seconds before
      # the minisig landed), so the gate waits — bounded — for the signature before
      # testing, and a signature that never arrives is a loud sign-job failure, not a skip.
      - name: Does the latest release ship the Linux tarball yet?
        id: gate
        run: |
          base="https://github.com/SecureCloudGroup/SmartBrain_3000/releases/latest/download"
          if ! curl -fsIL -o /dev/null "$base/SmartBrain-linux-x86_64.tar.gz"; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::latest release has no Linux tarball yet (it ships with v0.9.0) — nothing to test"
            exit 0
          fi
          for i in $(seq 1 60); do  # up to 5 minutes for the sign job to finish
            if curl -fsIL -o /dev/null "$base/SmartBrain-linux-x86_64.tar.gz.sha256.minisig"; then
              echo "present=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "signature not attached yet (sign job still running) — waiting ($i/60)"
            sleep 5
          done
          echo "::error::tarball is attached but its signature never arrived — the sign job failed or stalled"
          exit 1
      - name: A user session for systemd --user (runners have no login session)
        if: steps.gate.outputs.present == 'true'
        run: |
          sudo loginctl enable-linger "$USER"
          # give the user manager a moment to come up
          for _ in $(seq 1 10); do
            XDG_RUNTIME_DIR="/run/user/$(id -u)" systemctl --user is-system-running >/dev/null 2>&1 && break
            sleep 1
          done
      - name: Install exactly like the docs say (headless)
        if: steps.gate.outputs.present == 'true'
        run: |
          set -eux
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          # a careful user installs minisign first, so CI exercises the FULL verification path
          sudo apt-get update -qq && sudo apt-get install -qq -y minisign
          curl -fsSLO https://raw.githubusercontent.com/SecureCloudGroup/SmartBrain_3000/main/installer/install-linux.sh
          sh install-linux.sh --headless
      - name: Wait for health (first start assembles the app)
        if: steps.gate.outputs.present == 'true'
        run: |
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:33000/api/health >/dev/null; then
              echo "HEALTHY after ~$((i*5))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::native app never became healthy after 300s"
          systemctl --user status smartbrain.service || true
          tail -40 "$HOME/.config/SmartBrain/native/run/app.log" || true
          exit 1
      - name: First-run setup actually works, unit is active
        if: steps.gate.outputs.present == 'true'
        run: |
          set -eux
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          systemctl --user is-active smartbrain.service
          curl -sf -c /tmp/cj -X POST http://127.0.0.1:33000/api/account/setup \
            -H 'content-type: application/json' -d '{"passphrase":"smoke-test-passphrase"}' \
            | grep -q recovery_key
          curl -sf -b /tmp/cj -X POST http://127.0.0.1:33000/api/kb \
            -H 'content-type: application/json' -d '{"title":"Smoke","content":"the CANARY sentence"}' >/dev/null
          curl -sf -b /tmp/cj "http://127.0.0.1:33000/api/kb/search?q=canary&mode=lexical" \
            | grep -q '"Smoke"'
      - name: Uninstall keeps the data
        if: steps.gate.outputs.present == 'true'
        run: |
          set -eux
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          sh install-linux.sh --uninstall
          if [ -e "$HOME/.local/bin/smartbrain" ]; then
            echo "::error::uninstall left the bin symlink"; exit 1
          fi
          if systemctl --user is-active smartbrain.service 2>/dev/null; then
            echo "::error::unit still active after uninstall"; exit 1
          fi
          test -f "$HOME/.local/share/smartbrain/data/smartbrain.duckdb"
          echo "uninstall removed the launcher and kept the data"
