name: Native smoke (3 OS)

# Docker-exit Phase 0: prove the app runs NATIVELY — no container — on every OS we
# ship to, using the exact runtime the future native stack will bundle (Astral's
# python-build-standalone), the same requirements.lock the image installs, and the
# same first-run flow the Linux install-smoke exercises. Gateway-free on purpose:
# setup + knowledge + lexical search must work with no Bifrost and no model, which
# is also what a fresh native install looks like before anything is configured.

on:
  pull_request:
    paths:
      - "app/**"
      - "launcher/**"
      - ".github/workflows/native-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "41 6 * * 1" # weekly, Monday 06:41 UTC — drift canary like install-smoke

permissions:
  contents: read

env:
  PBS_RELEASE: "20260718"
  PBS_PYTHON: "3.12.13"

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pbs_triple: x86_64-unknown-linux-gnu
            pybin: python/bin/python3
          - os: macos-latest
            pbs_triple: aarch64-apple-darwin
            pybin: python/bin/python3
          - os: windows-latest
            pbs_triple: x86_64-pc-windows-msvc
            pybin: python/python.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Fetch the runtime we will actually ship (python-build-standalone)
        shell: bash
        run: |
          set -eux
          curl -fsSL -o pbs.tar.gz \
            "https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_RELEASE}/cpython-${PBS_PYTHON}+${PBS_RELEASE}-${{ matrix.pbs_triple }}-install_only_stripped.tar.gz"
          tar -xzf pbs.tar.gz
          ./${{ matrix.pybin }} --version

      - name: Install the app at its pinned versions (same lockfile as the image)
        shell: bash
        run: |
          set -eux
          ./${{ matrix.pybin }} -m pip install --quiet -c app/requirements.lock ./app

      - name: Boot natively + first-run setup + knowledge + search
        shell: bash
        run: |
          set -eux
          export SMARTBRAIN_DB_PATH="${RUNNER_TEMP}/native-home/smartbrain.duckdb"
          ./${{ matrix.pybin }} -m smartbrain_3000.serve &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:33000/api/health && break
            sleep 2
            if [ "$i" = "30" ]; then echo "::error::native app never became healthy"; exit 1; fi
          done
          curl -sf http://127.0.0.1:33000/api/health | grep -q '"status":"ok"'
          curl -sf -c cj.txt -X POST http://127.0.0.1:33000/api/account/setup \
            -H 'content-type: application/json' -d '{"passphrase":"native-smoke-pass"}' \
            | grep -q recovery_key
          curl -sf -b cj.txt -X POST http://127.0.0.1:33000/api/kb \
            -H 'content-type: application/json' -d '{"title":"Smoke","content":"the native CANARY sentence"}' >/dev/null
          curl -sf -b cj.txt "http://127.0.0.1:33000/api/kb/search?q=canary&mode=lexical" \
            | grep -q '"Smoke"'
          test -f "${RUNNER_TEMP}/native-home/smartbrain.duckdb"
          echo "native boot + setup + ingest + search all work on ${{ matrix.os }}"

  # The smoke matrix above hand-assembles the stack; this job makes the LAUNCHER do it —
  # the first CI run of native.Assemble on any OS. The launcher assembles an install from
  # a RELEASE (pinned pbs + that release's wheelhouse + the mirrored bifrost), and no
  # release carries this PR's version, so the build is stamped with the newest published
  # release: exactly the assets a real install fetches today. Unforced XDG paths on
  # purpose — the asserts pin down where user data and logs actually land.
  linux-native-e2e:
    name: linux native e2e (launcher assembles a real release)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: launcher/go.mod
      - name: Pick the newest published release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "assembling $tag"
      - name: Build the PR's launcher stamped as that release
        working-directory: launcher
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -eux
          CGO_ENABLED=0 go build -ldflags "-X main.launcherVersion=${TAG#v}" -o build/smartbrain .
      - name: start — assemble, boot, and adopt the real release
        run: |
          set -eux
          ./launcher/build/smartbrain start | tee start.out
          grep -q 'http://localhost:33000' start.out
          curl -sf http://127.0.0.1:33000/api/health | grep -q '"status":"ok"'
      # A failed start used to end with "see the log" — on a runner nobody can see.
      # The 2026-08-24 canary failure ("gateway: the process we started exited") was
      # undiagnosable for exactly that reason. Dump every log the launcher writes.
      - name: On failure, actually show the logs
        if: failure()
        run: |
          for f in "$HOME/.config/SmartBrain/native/run/app.log" \
                   "$HOME/.config/SmartBrain/native/run/bifrost.log"; do
            echo "===== $f ====="
            tail -n 100 "$f" 2>/dev/null || echo "(missing)"
          done
      - name: The app is really usable — setup, ingest, search
        run: |
          set -eux
          curl -sf -c cj.txt -X POST http://127.0.0.1:33000/api/account/setup \
            -H 'content-type: application/json' -d '{"passphrase":"native-e2e-pass"}' \
            | grep -q recovery_key
          curl -sf -b cj.txt -X POST http://127.0.0.1:33000/api/kb \
            -H 'content-type: application/json' -d '{"title":"Smoke","content":"the native CANARY sentence"}' >/dev/null
          curl -sf -b cj.txt "http://127.0.0.1:33000/api/kb/search?q=canary&mode=lexical" \
            | grep -q '"Smoke"'
      - name: Data and logs land where the docs say
        run: |
          set -eux
          # user data: the XDG path the app owns; logs: the folder "Open logs" opens
          test -f "$HOME/.local/share/smartbrain/data/smartbrain.duckdb"
          test -s "$HOME/.config/SmartBrain/native/run/app.log"
          test -s "$HOME/.config/SmartBrain/native/run/bifrost.log"
      - name: Bifrost listens on loopback only
        run: |
          set -eux
          ss -ltn | awk '$4 ~ /:38080$/ {print $4}' > bifrost.binds
          cat bifrost.binds
          test -s bifrost.binds
          if grep -v '^127\.0\.0\.1:' bifrost.binds; then
            echo "::error::bifrost is listening beyond loopback"; exit 1
          fi
      - name: status, stop, and the port actually closes
        run: |
          set -eux
          ./launcher/build/smartbrain status | grep -q running
          ./launcher/build/smartbrain stop
          if ./launcher/build/smartbrain status; then
            echo "::error::status still reports running after stop"; exit 1
          fi
          if curl -sf --max-time 3 http://127.0.0.1:33000/api/health; then
            echo "::error::app port still answers after stop"; exit 1
          fi
