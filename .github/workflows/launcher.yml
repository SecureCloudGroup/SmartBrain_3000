# Launcher — build the launcher for macOS, Windows, and Linux. It has no code signing certificate
# (a deliberate $0 choice): macOS binaries are AD-HOC signed, which is free and is all Apple Silicon
# needs to run, and the app is delivered through Homebrew/winget, which don't apply the quarantine
# flag — so no Gatekeeper/SmartScreen wall. Linux ships a static tarball verified by the install
# script and the self-updater. See docs on the install story.
#
# On a PR that touches the launcher, this just proves it still builds on every OS. On a version tag
# it also attaches the built app to that tag's GitHub Release, ready for the package channels.
name: Launcher

on:
  pull_request:
    paths:
      - "launcher/**"
      - "compose/docker-compose.release.yml"
      - ".github/workflows/launcher.yml"
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: drift + vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Embedded compose must match the canonical one
        # The launcher bakes in a copy of the release compose file. If it drifts from the real one
        # under compose/, users would run a stale stack. Fail loudly rather than ship the mismatch.
        run: diff compose/docker-compose.release.yml launcher/docker-compose.release.yml
      - uses: actions/setup-go@v7
        with:
          go-version-file: launcher/go.mod
      - name: gofmt
        working-directory: launcher
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo 'run gofmt'; exit 1; }
      - name: Vet + test
        working-directory: launcher
        # ./... , not ./stack/... : every test written for the update channel, the native
        # supervisor and the self-update swap lives outside stack/ and was never actually
        # run here. They passed locally in a container and nowhere else — which is not
        # coverage, it is a habit.
        run: |
          go vet ./...
          go test ./...

  macos:
    name: build (macOS universal, ad-hoc signed)
    runs-on: macos-latest
    permissions:
      contents: write # attach the .app to the release on a tag
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: launcher/go.mod
      - name: Build universal binary + bundle SmartBrain.app
        working-directory: launcher
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
        run: |
          set -eux
          # One binary for both CPU families, so a single download runs on Intel and Apple Silicon.
          # The baked version is what the self-updater compares against releases; dev builds
          # bake "0.0.0-dev", which the updater treats as never-update (fail-closed).
          LDFLAGS="-X main.launcherVersion=${VERSION#v}"
          GOARCH=arm64 CGO_ENABLED=1 go build -ldflags "$LDFLAGS" -o build/sb-arm64 .
          GOARCH=amd64 CGO_ENABLED=1 go build -ldflags "$LDFLAGS" -o build/sb-amd64 .
          lipo -create -output build/smartbrain build/sb-arm64 build/sb-amd64

          APP=build/SmartBrain.app
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/smartbrain "$APP/Contents/MacOS/SmartBrain"

          # App icon: turn the 512px source into a proper .icns so Finder shows an icon, not a blank
          # sheet. sips upscales the @2x sizes from the 512 source — fine for this flat placeholder.
          mkdir -p icon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s icon/icon_app.png --out "icon.iconset/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z $d $d icon/icon_app.png --out "icon.iconset/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o "$APP/Contents/Resources/SmartBrain.icns"

          # LSUIElement=1 → menu-bar app, no Dock icon or window. Identifier is our reverse-DNS.
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>SmartBrain</string>
            <key>CFBundleDisplayName</key><string>SmartBrain</string>
            <key>CFBundleIdentifier</key><string>com.securecloudgroup.smartbrain.launcher</string>
            <key>CFBundleExecutable</key><string>SmartBrain</string>
            <key>CFBundleIconFile</key><string>SmartBrain</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${VERSION#v}</string>
            <key>LSUIElement</key><true/>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
          </dict></plist>
          PLIST
          # Ad-hoc signature (-s -): free, no Apple account, and enough for arm64 to run the app.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --keepParent "$APP" build/SmartBrain-macos.zip
          # The self-updater verifies this sidecar before any swap.
          (cd build && shasum -a 256 SmartBrain-macos.zip > SmartBrain-macos.zip.sha256)
      - uses: actions/upload-artifact@v7
        with:
          name: SmartBrain-macos
          # The sidecar travels too: the sign job signs these EXACT bytes, so it must
          # sign the published file rather than recompute one that only looks the same.
          path: |
            launcher/build/SmartBrain-macos.zip
            launcher/build/SmartBrain-macos.zip.sha256
      - name: Ensure the release exists (tags only)
        if: github.ref_type == 'tag'
        uses: ./.github/actions/ensure-release
        with:
          tag: ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Attach to the release (tags only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" launcher/build/SmartBrain-macos.zip launcher/build/SmartBrain-macos.zip.sha256 --clobber

  windows:
    name: build (Windows exe)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: launcher/go.mod
      - name: Build SmartBrain.exe
        working-directory: launcher
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
        # systray on Windows is pure Go (no CGO), so this is a plain static build.
        run: |
          $ver = $env:VERSION -replace '^v',''
          go build -ldflags "-X main.launcherVersion=$ver" -o build/SmartBrain.exe .
          Compress-Archive -Path build/SmartBrain.exe -DestinationPath build/SmartBrain-windows.zip -Force
          $hash = (Get-FileHash build/SmartBrain-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  SmartBrain-windows.zip" | Out-File -Encoding ascii build/SmartBrain-windows.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: SmartBrain-windows
          path: |
            launcher/build/SmartBrain-windows.zip
            launcher/build/SmartBrain-windows.zip.sha256
      - name: Ensure the release exists (tags only)
        if: github.ref_type == 'tag'
        uses: ./.github/actions/ensure-release
        with:
          tag: ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Attach to the release (tags only)
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" launcher/build/SmartBrain-windows.zip launcher/build/SmartBrain-windows.zip.sha256 --clobber

  linux:
    name: build (Linux x86_64, static)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: launcher/go.mod
      - name: Build the smartbrain binary + tarball
        working-directory: launcher
        env:
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0-dev' }}
        # systray on Linux is pure-Go (StatusNotifierItem over D-Bus), so CGO stays off:
        # one fully static binary runs on any x86_64 distro, glibc or not. The artifact
        # is a tarball, not a zip, because tar preserves the exec bit — the self-updater
        # unpacks this same flat layout when it swaps itself.
        run: |
          set -eux
          CGO_ENABLED=0 go build -ldflags "-s -w -X main.launcherVersion=${VERSION#v}" -o build/smartbrain .
          cp ../packaging/linux/smartbrain.desktop build/smartbrain.desktop
          cp icon/icon_app.png build/smartbrain.png
          tar -C build -czf build/SmartBrain-linux-x86_64.tar.gz smartbrain smartbrain.desktop smartbrain.png
          # The self-updater verifies this sidecar before any swap.
          (cd build && sha256sum SmartBrain-linux-x86_64.tar.gz > SmartBrain-linux-x86_64.tar.gz.sha256)
      - uses: actions/upload-artifact@v7
        with:
          name: SmartBrain-linux
          # The sidecar travels too: the sign job signs these EXACT bytes, so it must
          # sign the published file rather than recompute one that only looks the same.
          path: |
            launcher/build/SmartBrain-linux-x86_64.tar.gz
            launcher/build/SmartBrain-linux-x86_64.tar.gz.sha256
      - name: Ensure the release exists (tags only)
        if: github.ref_type == 'tag'
        uses: ./.github/actions/ensure-release
        with:
          tag: ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Attach to the release (tags only)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" launcher/build/SmartBrain-linux-x86_64.tar.gz launcher/build/SmartBrain-linux-x86_64.tar.gz.sha256 --clobber

  sign:
    name: sign the release checksums (tags only)
    needs: [macos, windows, linux] # sign what those jobs actually published
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # attach the .minisig files to the release
    env:
      SMARTBRAIN_SIGNING_KEY: ${{ secrets.SMARTBRAIN_SIGNING_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version-file: launcher/go.mod }
      - uses: actions/download-artifact@v8
        with: { name: SmartBrain-macos, path: dist }
      - uses: actions/download-artifact@v8
        with: { name: SmartBrain-windows, path: dist }
      - uses: actions/download-artifact@v8
        with: { name: SmartBrain-linux, path: dist }

      # Fail loudly rather than publishing a release the launcher will refuse to
      # install: a signature is not optional, so a missing key is a broken release.
      - name: Require the signing key
        run: |
          if [ -z "$SMARTBRAIN_SIGNING_KEY" ]; then
            echo "SMARTBRAIN_SIGNING_KEY is not set — the launcher refuses unsigned releases." >&2
            echo "See docs/internal/release-signing.md." >&2
            exit 1
          fi

      # Catch a rotated-but-not-shipped key here, where it is a red build, instead of
      # after publishing an update every installed launcher rejects. The Linux install
      # script embeds the same key for its download verification, so it is held to the
      # same bar — a drifted copy there would make every script install fail verification.
      - name: Check the key matches the one launchers verify with
        working-directory: launcher
        run: |
          baked="$(grep -oP 'releasePublicKey = "\K[^"]*' update/signature.go)"
          embedded="$(grep -oP 'MINISIGN_PUBKEY="\K[^"]*' ../installer/install-linux.sh)"
          signing="$(go run ./cmd/sbsign pubkey)"
          if [ "$baked" != "$signing" ] || [ "$embedded" != "$signing" ]; then
            echo "signing key mismatch:" >&2
            echo "  launcher (update/signature.go):     ${baked:-<empty>}" >&2
            echo "  script (installer/install-linux.sh): ${embedded:-<empty>}" >&2
            echo "  signing:                             $signing" >&2
            exit 1
          fi

      - name: Sign the checksum sidecars
        run: |
          go -C launcher run ./cmd/sbsign sign \
            "$PWD/dist/SmartBrain-macos.zip.sha256" \
            "$PWD/dist/SmartBrain-windows.zip.sha256" \
            "$PWD/dist/SmartBrain-linux-x86_64.tar.gz.sha256"

      - name: Attach the signatures to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            dist/SmartBrain-macos.zip.sha256.minisig \
            dist/SmartBrain-windows.zip.sha256.minisig \
            dist/SmartBrain-linux-x86_64.tar.gz.sha256.minisig --clobber

      # Concurrent `gh release create` calls have produced two release objects for one tag
      # before (v0.8.6, v0.8.14) — assets then scatter across both, and users can land on
      # the empty one. ensure-release narrows that race; this catches whatever slips through,
      # while a duplicate is still cheap to delete and re-run.
      - name: Exactly one release object must exist for this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                --jq "[.[] | select(.tag_name==\"${GITHUB_REF_NAME}\")] | length")
          if [ "$n" != "1" ]; then
            echo "expected exactly one release for ${GITHUB_REF_NAME}, found $n —" >&2
            echo "delete the duplicate (gh release list --json name,tagName,id) and re-run this job." >&2
            exit 1
          fi

  packages:
    name: bump package managers (tags only)
    needs: [macos, windows] # the built zips are what we hash
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the packaging-bump branch
      pull-requests: write # open the housekeeping PR into main
    env:
      # Lifted to a job env so the tap/bucket steps can gate on its presence — the `secrets` context
      # can't be used directly in a step `if:`.
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      # Hash the SAME zips that were just published, so the manifests can never point at a stale build.
      - uses: actions/download-artifact@v8
        with: { name: SmartBrain-macos, path: dist }
      - uses: actions/download-artifact@v8
        with: { name: SmartBrain-windows, path: dist }

      - name: Rewrite manifests for this version
        run: |
          python3 packaging/refresh.py --version "${{ github.ref_name }}" \
            --macos dist/SmartBrain-macos.zip --windows dist/SmartBrain-windows.zip

      # The tap and bucket are SEPARATE repos, so the default GITHUB_TOKEN can't reach them. They only
      # update if a PACKAGES_TOKEN secret (a PAT with write to homebrew-tap + scoop-bucket) is set —
      # otherwise these steps are skipped and only the in-repo PR below is opened.
      - name: Push the cask to the Homebrew tap
        if: env.PACKAGES_TOKEN != ''
        run: |
          git clone --depth 1 "https://x-access-token:${PACKAGES_TOKEN}@github.com/SecureCloudGroup/homebrew-tap" tap
          cp packaging/homebrew/Casks/smartbrain.rb tap/Casks/smartbrain.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/smartbrain.rb
          git diff --cached --quiet || git commit -m "SmartBrain ${{ github.ref_name }}"
          git push

      - name: Push the manifest to the Scoop bucket
        if: env.PACKAGES_TOKEN != ''
        run: |
          git clone --depth 1 "https://x-access-token:${PACKAGES_TOKEN}@github.com/SecureCloudGroup/scoop-bucket" bucket
          cp packaging/scoop/smartbrain.json bucket/bucket/smartbrain.json
          cd bucket
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/smartbrain.json
          git diff --cached --quiet || git commit -m "SmartBrain ${{ github.ref_name }}"
          git push

      # Submit the winget update to microsoft/winget-pkgs (opens a PR their bot validates + a
      # maintainer merges). komac bases the update on the PREVIOUS version already in winget-pkgs, so
      # this only works once v0.4.0 has merged there — i.e. it kicks in from the next release onward.
      # winget-releaser requires a CLASSIC PAT (public_repo); the same PACKAGES_TOKEN drives it.
      - name: Submit the winget update
        if: env.PACKAGES_TOKEN != ''
        # Non-fatal: until v0.4.0 is merged into winget-pkgs, komac has no prior version to base an
        # update on and this errors — that must NOT fail the release or block the tap/bucket/packaging steps.
        # TODO: drop continue-on-error once v0.4.0 is live in winget, so a real regression can't hide here.
        continue-on-error: true
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: SecureCloudGroup.SmartBrain
          installers-regex: 'SmartBrain-windows\.zip$'
          release-tag: ${{ github.ref_name }}
          fork-user: SecureCloudGroup
          token: ${{ secrets.PACKAGES_TOKEN }}

      # Keep packaging/ in the repo honest too — as a PR, because main is branch-protected.
      - name: Open a PR bumping packaging/ in main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet packaging/; then echo "packaging already at this version"; exit 0; fi
          BR="bump-packaging-${{ github.ref_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add packaging/
          git commit -m "build(packaging): bump manifests to ${{ github.ref_name }}"
          git push -u origin "$BR"
          # The repo may forbid Actions from creating PRs ("Allow GitHub Actions to create and
          # approve pull requests" unchecked). The branch is pushed either way — a human can open the
          # PR from it — and the RELEASE itself already succeeded, so never fail the job over this.
          gh pr create --base main --head "$BR" \
            --title "build(packaging): bump manifests to ${{ github.ref_name }}" \
            --body "Automated: regenerated the cask, winget, and Scoop manifests for ${{ github.ref_name }} from the release assets. This run already updated the live Homebrew tap + Scoop bucket and opened the winget-pkgs PR; this PR just keeps packaging/ in sync." \
            || echo "::warning::Could not open the packaging-bump PR (Actions may lack PR-creation permission). Branch $BR is pushed — open the PR manually, or enable 'Allow GitHub Actions to create and approve pull requests' in Settings → Actions → General."
