# Release — build the backend image ONCE, for both CPU architectures, and push it to the GitHub
# Container Registry (ghcr.io). Users then PULL a ready-made image instead of building it locally,
# which is what turns first-run from "20–30 minutes compiling" into "a couple of minutes downloading".
#
# Triggered by pushing a version tag (e.g. `git tag v0.4.0 && git push --tags`), or by hand from the
# Actions tab. Nothing here runs on a normal PR — a fork must never be able to push an image under
# our name (the registry write below is gated on the tag/dispatch, and PRs get a read-only token).
name: Release image

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual re-run from the Actions tab (e.g. to re-push :latest)

# Least privilege: read the repo, write packages (the image), write releases (the
# native wheelhouse assets attach to the same tag's release the launcher zips use).
permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never abort a half-finished push — a partial image tag is worse than a wait

jobs:
  image:
    name: build + push (amd64, arm64)
    runs-on: ubuntu-latest
    env:
      # ghcr rejects upper-case names, and github.repository is mixed-case (SecureCloudGroup/…).
      # Pin the lower-cased path once and use it for BOTH the tags and the build cache — the cache
      # refs are hand-written (metadata-action only lower-cases the tags), so they need this too.
      IMAGE: ghcr.io/securecloudgroup/smartbrain_3000
    steps:
      - uses: actions/checkout@v7

      # arm64 is built under emulation on this amd64 runner. It stays fast because every native
      # dependency (duckdb, cryptography, argon2, numpy, uvloop, watchfiles) ships an aarch64 wheel,
      # so `pip install` downloads rather than compiles — QEMU only runs Python, not a C toolchain.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # scoped to this repo, expires with the run — no stored secret

      # Derive the image name + tags. `ghcr.io/<owner>/<repo>` is lower-cased for us here (ghcr
      # rejects upper-case), and a `vMAJOR.MINOR.PATCH` tag yields `1.2.3`, `1.2`, and `latest`.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bake the release version (the bare semver, e.g. 0.5.1) into the image so /api/health
          # and the UI report the tag that was built, not a frozen constant.
          build-args: |
            SMARTBRAIN_VERSION=${{ steps.meta.outputs.version }}
          # Cache layers in the registry so a re-tag of the same source is near-instant.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  # Docker-exit Phase 1: alongside the image, publish per-OS "wheelhouse" artifacts —
  # every dependency wheel at the SAME requirements.lock the image installs, plus the
  # app's own wheel and a version stamp. The native launcher assembles an install from
  # exactly these (python-build-standalone runtime + this wheelhouse + the mirrored
  # bifrost-http binary), fully offline once downloaded. Wheels are built on 3.12 to
  # match the pinned pbs runtime ABI (cp312).
  wheelhouse:
    name: wheelhouse (${{ matrix.label }})
    if: github.ref_type == 'tag' # artifacts attach to the tag's release; dispatch re-runs skip
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: macos-latest
            label: macos-arm64
          - os: windows-latest
            label: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the wheelhouse at the pinned versions
        shell: bash
        run: |
          set -eux
          python -m pip install --upgrade pip
          python -m pip wheel --wheel-dir wheelhouse -c app/requirements.lock ./app
          echo "${GITHUB_REF_NAME#v}" > wheelhouse/VERSION
          ls wheelhouse | wc -l
      - name: Package + checksum
        shell: bash
        run: |
          set -eux
          NAME="smartbrain-wheelhouse-${GITHUB_REF_NAME#v}-${{ matrix.label }}"
          mv wheelhouse "$NAME"
          # zip is absent on windows runners' bash; python's zipfile is everywhere.
          python -c "import shutil; shutil.make_archive('$NAME', 'zip', '.', '$NAME')"
          python -c "import hashlib,sys; print(hashlib.sha256(open('$NAME.zip','rb').read()).hexdigest(), ' $NAME.zip')" > "$NAME.zip.sha256"
          cat "$NAME.zip.sha256"
      - name: Attach to the tag's release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh release create "${GITHUB_REF_NAME}" --generate-notes || true
          gh release upload "${GITHUB_REF_NAME}" smartbrain-wheelhouse-*.zip smartbrain-wheelhouse-*.zip.sha256 --clobber
