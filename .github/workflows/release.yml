# Release — build the backend image ONCE, for both CPU architectures, and push it to the GitHub
# Container Registry (ghcr.io). Users then PULL a ready-made image instead of building it locally,
# which is what turns first-run from "20–30 minutes compiling" into "a couple of minutes downloading".
#
# Triggered by pushing a version tag (e.g. `git tag v0.4.0 && git push --tags`), or by hand from the
# Actions tab. Nothing here runs on a normal PR — a fork must never be able to push an image under
# our name (the registry write below is gated on the tag/dispatch, and PRs get a read-only token).
name: Release image

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual re-run from the Actions tab (e.g. to re-push :latest)

# Least privilege: read the repo, write packages (the image), write releases (the
# native wheelhouse assets attach to the same tag's release the launcher zips use).
permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never abort a half-finished push — a partial image tag is worse than a wait

jobs:
  # The example vault (landing/vaults/smartbrain-docs.sbvault) ships the user guide to
  # subscribers, but CI cannot rebuild it — the publisher's Ed25519 signing key lives only
  # in the operator's sb_publisher_data Docker volume (subscribers PIN that key). Without
  # this gate a release can quietly ship a guide the published vault no longer matches:
  # subscribers then see "up to date" forever against stale docs (it happened — the vault
  # sat at its 2026-07-18 build while docs/ was rewritten for weeks). Rebuild locally with
  #   SB_PUBLISHER_PASS=<passphrase> python3 tools/example-vaults/build.py
  # and commit the refreshed vault, then re-tag.
  vault-freshness:
    name: example vault matches docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the check is ancestry between the vault's last commit and HEAD
      - name: Fail if the user guide changed after the vault was last rebuilt
        run: |
          set -eu
          vault=landing/vaults/smartbrain-docs.sbvault
          vault_commit=$(git log -1 --format=%H -- "$vault")
          test -n "$vault_commit" # the vault must exist and have history
          stale=$(git log --format='%h %s' "$vault_commit..HEAD" -- 'docs/0*.md')
          if [ -n "$stale" ]; then
            echo "::error::docs/ changed after $vault was last rebuilt — rebuild it (see the comment on this job), commit, and re-tag. Stale commits:"
            echo "$stale"
            exit 1
          fi
          echo "vault is current (last rebuilt in $vault_commit)"

  image:
    name: build + push (amd64, arm64)
    needs: [vault-freshness]
    runs-on: ubuntu-latest
    env:
      # ghcr rejects upper-case names, and github.repository is mixed-case (SecureCloudGroup/…).
      # Pin the lower-cased path once and use it for BOTH the tags and the build cache — the cache
      # refs are hand-written (metadata-action only lower-cases the tags), so they need this too.
      IMAGE: ghcr.io/securecloudgroup/smartbrain_3000
    steps:
      - uses: actions/checkout@v7

      # arm64 is built under emulation on this amd64 runner. It stays fast because every native
      # dependency (duckdb, cryptography, argon2, numpy, uvloop, watchfiles) ships an aarch64 wheel,
      # so `pip install` downloads rather than compiles — QEMU only runs Python, not a C toolchain.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # scoped to this repo, expires with the run — no stored secret

      # Derive the image name + tags. `ghcr.io/<owner>/<repo>` is lower-cased for us here (ghcr
      # rejects upper-case), and a `vMAJOR.MINOR.PATCH` tag yields `1.2.3`, `1.2`, and `latest`.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Bake the release version (the bare semver, e.g. 0.5.1) into the image so /api/health
          # and the UI report the tag that was built, not a frozen constant.
          build-args: |
            SMARTBRAIN_VERSION=${{ steps.meta.outputs.version }}
          # Cache layers in the registry so a re-tag of the same source is near-instant.
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

  # The page browser's renderer sidecar (ni-format §35) — the only container that runs a browser
  # engine on the Docker stack; the compose `render` profile pulls it. compose/render/Dockerfile
  # builds it FROM the app's base image with the app package, and installs the pinned engine at
  # BUILD time through the app's own installer (pinned GitHub URL, size cap, sha256 before
  # unpacking, member hashes): the build fails unless the engine re-hashes clean. Same platforms
  # and the same tags as the app image, because both compose services take theirs from one
  # SMARTBRAIN_VERSION. After the app image, so a renderer never ships without its app; tags only.
  render-image:
    name: renderer sidecar build + push (amd64, arm64)
    needs: [image]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/securecloudgroup/smartbrain_3000-render
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: compose/render/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SMARTBRAIN_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Ensure the release exists
        uses: ./.github/actions/ensure-release
        with:
          tag: ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
      # The notes pin what was published: a tag can be moved, a digest cannot. A re-run replaces
      # its own line; a failed read of the notes stops here rather than overwrite them.
      - name: Name the image digest in the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          case "$DIGEST" in sha256:*) ;; *) echo "::error::the build reported no image digest"; exit 1 ;; esac
          gh release view "$GITHUB_REF_NAME" --json body --jq .body > body.md
          body="$(grep -v '^Renderer sidecar image: ' body.md || true)"
          # shellcheck disable=SC2016 # the backticks are Markdown, not a command
          printf '%s\n\nRenderer sidecar image: `%s@%s`\n' "$body" "$REF" "$DIGEST" > notes.md
          gh release edit "$GITHUB_REF_NAME" --notes-file notes.md

  # Docker-exit Phase 1: alongside the image, publish per-OS "wheelhouse" artifacts —
  # every dependency wheel at the SAME requirements.lock the image installs, plus the
  # app's own wheel and a version stamp. The native launcher assembles an install from
  # exactly these (python-build-standalone runtime + this wheelhouse + the mirrored
  # bifrost-http binary), fully offline once downloaded. Wheels are built on 3.12 to
  # match the pinned pbs runtime ABI (cp312).
  wheelhouse:
    name: wheelhouse (${{ matrix.label }})
    needs: [vault-freshness]
    if: github.ref_type == 'tag' # artifacts attach to the tag's release; dispatch re-runs skip
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: macos-latest
            label: macos-arm64
          - os: windows-latest
            label: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the wheelhouse at the pinned versions
        shell: bash
        run: |
          set -eux
          python -m pip install --upgrade pip
          python -m pip wheel --wheel-dir wheelhouse -c app/requirements.lock ./app
          echo "${GITHUB_REF_NAME#v}" > wheelhouse/VERSION
          ls wheelhouse | wc -l
      - name: Package + checksum
        shell: bash
        run: |
          set -eux
          NAME="smartbrain-wheelhouse-${GITHUB_REF_NAME#v}-${{ matrix.label }}"
          mv wheelhouse "$NAME"
          # zip is absent on windows runners' bash; python's zipfile is everywhere.
          python -c "import shutil; shutil.make_archive('$NAME', 'zip', '.', '$NAME')"
          python -c "import hashlib,sys; print(hashlib.sha256(open('$NAME.zip','rb').read()).hexdigest(), ' $NAME.zip')" > "$NAME.zip.sha256"
          cat "$NAME.zip.sha256"
      - name: Ensure the release exists
        uses: ./.github/actions/ensure-release
        with:
          tag: ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Attach to the tag's release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          gh release upload "${GITHUB_REF_NAME}" smartbrain-wheelhouse-*.zip smartbrain-wheelhouse-*.zip.sha256 --clobber
